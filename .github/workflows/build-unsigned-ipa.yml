name: Build Unsigned iOS IPA (Noor)

on:
  push:
    branches: [ main, master, NoorAliIOS, aliandroidv2 ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA File
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Update Capacitor plugins to latest compatible versions
        run: |
          npm install @capacitor/share@latest @capacitor/local-notifications@latest @capacitor/app@latest @capacitor/filesystem@latest @capacitor/geolocation@latest @capacitor/haptics@latest @capacitor/core@latest @capacitor/ios@latest @capacitor/cli@latest --legacy-peer-deps
          npm install @capacitor-community/keep-awake@latest @capacitor-community/speech-recognition@latest --legacy-peer-deps

      - name: Build Web Dist Assets
        run: npm run build

      - name: Sync Capacitor iOS Native Project
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: List Xcode version and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve Swift Package Dependencies
        working-directory: ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Build Xcode Archive (Unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            archive -archivePath ../../build/App.xcarchive \
            | tail -50

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r Noor_Khutbah_unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Khutbah-Unsigned-IPA
          path: Noor_Khutbah_unsigned.ipa
          retention-days: 30
