name: Build Unsigned iOS IPA (Noor)

on:
  push:
    branches: [ main, master, NoorAliIOS, aliandroidv2 ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA File
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clean install dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Re-run postinstall to ensure SPM version sync
        run: node scripts/inject-speech-recognition-spm.mjs

      - name: Build Web Dist Assets
        run: npm run build

      - name: Capacitor sync iOS
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Xcode Archive (Unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            archive -archivePath build/App.xcarchive

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find . -name "*.app" -type d | grep -v "DerivedData" | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Noor_Khutbah_unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Khutbah-Unsigned-IPA
          path: Noor_Khutbah_unsigned.ipa
          retention-days: 30
